<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .qr-block { fill: #1e293b; }
      .qris-red { fill: #ee3124; }
      .text-dark { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  
  <!-- Background Card -->
  <rect width="300" height="300" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="298" height="298" rx="15" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- QRIS Header Banner -->
  <path d="M 0 16 Q 0 0 16 0 L 284 0 Q 300 0 300 16 L 300 52 L 0 52 Z" fill="#ffffff" />
  
  <!-- QRIS Logo Representation -->
  <g transform="translate(100, 12)">
    <!-- QRIS stylized text -->
    <text x="50" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="22" letter-spacing="1.5" fill="#1e293b">QRIS</text>
    <text x="50" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="6" letter-spacing="0.5" fill="#ee3124">QR INDONESIA STANDAR</text>
  </g>

  <!-- Divider Line -->
  <line x1="16" y1="52" x2="284" y2="52" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- QR Code Matrix Elements -->
  <g transform="translate(30, 64)">
    <!-- Top-Left Finder Pattern -->
    <rect x="0" y="0" width="56" height="56" rx="6" fill="#0f172a"/>
    <rect x="8" y="8" width="40" height="40" rx="3" fill="#ffffff"/>
    <rect x="16" y="16" width="24" height="24" rx="2" fill="#0f172a"/>

    <!-- Top-Right Finder Pattern -->
    <rect x="184" y="0" width="56" height="56" rx="6" fill="#0f172a"/>
    <rect x="192" y="8" width="40" height="40" rx="3" fill="#ffffff"/>
    <rect x="200" y="16" width="24" height="24" rx="2" fill="#0f172a"/>

    <!-- Bottom-Left Finder Pattern -->
    <rect x="0" y="152" width="56" height="56" rx="6" fill="#0f172a"/>
    <rect x="8" y="160" width="40" height="40" rx="3" fill="#ffffff"/>
    <rect x="16" y="168" width="24" height="24" rx="2" fill="#0f172a"/>

    <!-- Alignment Pattern -->
    <rect x="168" y="136" width="40" height="40" rx="4" fill="#0f172a"/>
    <rect x="176" y="144" width="24" height="24" rx="2" fill="#ffffff"/>
    <rect x="184" y="152" width="8" height="8" fill="#0f172a"/>

    <!-- Decorative QR Data Dots (Realistic QR Matrix Pattern) -->
    <!-- Row blocks -->
    <rect x="68" y="4" width="10" height="10" rx="1.5" class="qr-block"/>
    <rect x="86" y="4" width="18" height="10" rx="1.5" class="qr-block"/>
    <rect x="112" y="4" width="10" height="10" rx="1.5" class="qr-block"/>
    <rect x="130" y="4" width="18" height="10" rx="1.5" class="qr-block"/>
    <rect x="156" y="4" width="18" height="10" rx="1.5" class="qr-block"/>

    <rect x="68" y="20" width="18" height="10" rx="1.5" class="qr-block"/>
    <rect x="94" y="20" width="10" height="10" rx="1.5" class="qr-block"/>
    <rect x="120" y="20" width="28" height="10" rx="1.5" class="qr-block"/>
    <rect x="156" y="20" width="10" height="10" rx="1.5" class="qr-block"/>

    <rect x="68" y="38" width="10" height="10" rx="1.5" class="qr-block"/>
    <rect x="86" y="38" width="28" height="10" rx="1.5" class="qr-block"/>
    <rect x="130" y="38" width="10" height="10" rx="1.5" class="qr-block"/>
    <rect x="148" y="38" width="18" height="10" rx="1.5" class="qr-block"/>

    <!-- Timing horizontal & vertical -->
    <rect x="68" y="56" width="104" height="6" rx="1" fill="#334155"/>
    <rect x="56" y="68" width="6" height="76" rx="1" fill="#334155"/>

    <!-- Center Data modules -->
    <rect x="8" y="68" width="18" height="10" rx="1.5" class="qr-block"/>
    <rect x="34" y="68" width="10" height="24" rx="1.5" class="qr-block"/>
    <rect x="8" y="86" width="20" height="18" rx="1.5" class="qr-block"/>
    <rect x="8" y="112" width="36" height="10" rx="1.5" class="qr-block"/>
    <rect x="22" y="130" width="22" height="12" rx="1.5" class="qr-block"/>

    <rect x="74" y="70" width="20" height="16" rx="1.5" class="qr-block"/>
    <rect x="102" y="70" width="12" height="12" rx="1.5" class="qr-block"/>
    <rect x="122" y="70" width="22" height="12" rx="1.5" class="qr-block"/>
    <rect x="152" y="70" width="12" height="26" rx="1.5" class="qr-block"/>
    <rect x="172" y="70" width="22" height="12" rx="1.5" class="qr-block"/>
    <rect x="202" y="70" width="30" height="12" rx="1.5" class="qr-block"/>

    <rect x="74" y="94" width="12" height="24" rx="1.5" class="qr-block"/>
    <rect x="94" y="90" width="20" height="12" rx="1.5" class="qr-block"/>
    <rect x="122" y="90" width="22" height="24" rx="1.5" class="qr-block"/>
    <rect x="172" y="90" width="12" height="20" rx="1.5" class="qr-block"/>
    <rect x="192" y="90" width="40" height="12" rx="1.5" class="qr-block"/>

    <!-- Center Icon Shield -->
    <rect x="98" y="88" width="44" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M 120 96 L 134 102 L 134 116 Q 134 126 120 130 Q 106 126 106 116 L 106 102 Z" fill="#3b82f6"/>
    <path d="M 115 112 L 119 116 L 126 108" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lower modules -->
    <rect x="74" y="126" width="16" height="16" rx="1.5" class="qr-block"/>
    <rect x="150" y="104" width="14" height="38" rx="1.5" class="qr-block"/>
    <rect x="192" y="110" width="20" height="18" rx="1.5" class="qr-block"/>
    <rect x="220" y="110" width="14" height="24" rx="1.5" class="qr-block"/>

    <rect x="68" y="152" width="14" height="22" rx="1.5" class="qr-block"/>
    <rect x="90" y="152" width="24" height="12" rx="1.5" class="qr-block"/>
    <rect x="122" y="140" width="18" height="24" rx="1.5" class="qr-block"/>
    <rect x="148" y="150" width="12" height="24" rx="1.5" class="qr-block"/>
    <rect x="216" y="142" width="18" height="32" rx="1.5" class="qr-block"/>

    <rect x="68" y="182" width="24" height="18" rx="1.5" class="qr-block"/>
    <rect x="100" y="172" width="14" height="28" rx="1.5" class="qr-block"/>
    <rect x="122" y="172" width="38" height="12" rx="1.5" class="qr-block"/>
    <rect x="168" y="184" width="30" height="16" rx="1.5" class="qr-block"/>
    <rect x="206" y="182" width="28" height="18" rx="1.5" class="qr-block"/>
  </g>

  <!-- Bottom Brand Tag -->
  <text x="150" y="286" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="9" fill="#64748b" letter-spacing="0.3">ASOSIASI SISTEM PEMBAYARAN INDONESIA (ASPI)</text>
</svg>
